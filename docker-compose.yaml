version: "3.9"
services:
  app:
    build: .
    container_name: todoapp
    ports:
      - "8080:8080"
    depends_on:
      - mongo
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/todoapp
      SPRING_PROFILES_ACTIVE: docker

  mongo:
    image: mongo:6.0
    container_name: todo-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
