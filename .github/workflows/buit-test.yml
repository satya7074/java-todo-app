name: Build and Test ToDoApp

on:
  push:
    branches: [ "main", "master","feature/todo-app-spring-security" ]
  pull_request:
    branches: [ "main", "master","feature/todo-app-spring-security" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Build with Maven
#      - name: Build with Maven
#        run: mvn -B clean package --file pom.xml

      # 4. Run tests
      - name: Run Tests
        run: mvn test
